<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập • Nexora Gaming</title><link rel="stylesheet" href="styles.css?v=1"></head><body><header class="top"><a class="brand" href="index.html">NEXORA <span>GAMING</span></a></header><main class="auth-wrap"><section class="auth-card"><div class="tabs"><button id="loginTab" class="active">Đăng nhập</button><button id="registerTab">Đăng ký</button></div><form id="loginForm"><h2>Chào mừng trở lại 👋</h2><label>Email<input id="loginEmail" type="email" required></label><label>Mật khẩu<input id="loginPassword" type="password" minlength="6" required></label><button class="btn full">Đăng nhập</button></form><form id="registerForm" class="hidden"><h2>Tạo tài khoản 🎮</h2><label>Nickname<input id="registerName" maxlength="24" required placeholder="Tên hiển thị"></label><label>Email<input id="registerEmail" type="email" required></label><label>Mật khẩu<input id="registerPassword" type="password" minlength="6" required></label><button class="btn full">Đăng ký miễn phí</button><p class="note">Không sử dụng mật khẩu tài khoản game của bạn.</p></form><p id="authMsg" class="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js?v=1"></script></body></html>
